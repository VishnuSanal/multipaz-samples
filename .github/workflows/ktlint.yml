name: ktlint

on:
  push:
    branches:
      - main
      - code-starter
    paths:
      - MultipazCodelab/Holder/**
  pull_request:
    branches:
      - main
      - code-starter
    paths:
      - MultipazCodelab/Holder/**

jobs:
  ktlint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Run ktlint check
        id: ktlint
        run: |
          cd MultipazCodelab/Holder/
          chmod +x gradlew
          ./gradlew ktlintCheck
        continue-on-error: true

      - name: Comment on PR if ktlint failed
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **ktlint check failed**

              Please run:

              \`\`\`bash
              ./gradlew ktlintFormat
              \`\`\`

              Then commit and push the formatted changes.`
            })

      - name: Fail job if ktlint failed
        if: steps.ktlint.outcome == 'failure'
        run: exit 1
